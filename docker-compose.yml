version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: knowledge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: BDsec2022,,
      MYSQL_DATABASE: knowledge_base
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./knowledge_base.sql:/docker-entrypoint-initdb.d/knowledge_base.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL + pgvector 向量数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-postgres
    restart: always
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos 服务注册中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: knowledge-nacos
    restart: always
    environment:
      MODE: standalone
      # SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 知识库应用服务
  knowledge-base-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-base-server
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/knowledge_base?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: BDsec2022,,
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      AI_EMBEDDING_STORAGE_PGVECTOR_HOST: postgres
      AI_EMBEDDING_STORAGE_PGVECTOR_PORT: 5432
      AI_EMBEDDING_STORAGE_PGVECTOR_DATABASE: vectordb
      AI_EMBEDDING_STORAGE_PGVECTOR_USER: postgres
      AI_EMBEDDING_STORAGE_PGVECTOR_PASSWORD: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./log:/app/log
      - ./.tmp/knowledge-base/doc:/app/.tmp/knowledge-base/doc
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - knowledge-network

  # API 网关服务
  knowledge-base-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: knowledge-base-gateway
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    volumes:
      - ./gateway-log:/app/log
    depends_on:
      nacos:
        condition: service_healthy
      knowledge-base-server:
        condition: service_started
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 前端服务 (Nginx)
  knowledge-base-frontend:
    build:
      context: ./knowledge-base-vue
      dockerfile: Dockerfile
    container_name: knowledge-base-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      knowledge-base-gateway:
        condition: service_healthy
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nacos_data:
    driver: local

networks:
  knowledge-network:
    driver: bridge
