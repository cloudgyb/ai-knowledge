server:
  port: 8000

spring:
  application:
    name: knowledge-base-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:BDsec2022,,}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/knowledge_base?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false}
  jackson:
    date-format: 'yyyy-MM-dd HH:mm:ss'
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
        namespace: public
        username: nacos
        password: nacos
        weight: 1
        cluster-name: DEFAULT
  servlet:
    multipart:
      max-file-size: 10485760
      location: /tmp/
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 1
      timeout: 5s

mybatis-plus:
  global-config:
    db-config:
      insert-strategy: not_null
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  auto-renew: true
  token-name: token
  token-style: uuid
  is-read-cookie: false

knowledge-base:
  doc:
    storage:
      path: /app/.tmp/knowledge-base/doc

ai:
  embedding:
    storage:
      pgvector:
        host: ${AI_EMBEDDING_STORAGE_PGVECTOR_HOST:postgres}
        port: ${AI_EMBEDDING_STORAGE_PGVECTOR_PORT:5432}
        database: ${AI_EMBEDDING_STORAGE_PGVECTOR_DATABASE:vectordb}
        user: ${AI_EMBEDDING_STORAGE_PGVECTOR_USER:postgres}
        password: ${AI_EMBEDDING_STORAGE_PGVECTOR_PASSWORD:postgres}
        table: embedding_store
        metadataStorageMode: COMBINED_JSON
  http:
    debug: false
  scoring:
    model:
      onnx:
        pathToModel: /app/models/model.onnx
        pathToTokenizer: /app/models/tokenizer.json

logging:
  file:
    name: /app/log/knowledge-base.log
  level:
    root: info
    com.github.cloudgyb: debug
    com.github.cloudgyb.ai.knowledge.server.modules.chat.service.AiChatService: info
